name: Refresh equity dataset

on:
  schedule:
    # 18:35 Asia/Shanghai, after the market close.
    - cron: '35 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-equity-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TQDM_DISABLE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-refresh.txt
      - name: Install the application and AKShare
        run: python -m pip install -r requirements-refresh.txt
      - name: Verify the data pipeline and backend
        run: python -m unittest discover -s tests -v
      - name: Fetch daily data and run the existing abstraction
        run: python scripts/refresh_equities.py
      - name: Publish a complete, validated dataset
        run: |
          git add -- datasets/live/equities.graphml datasets/live/manifest.json datasets/live/latest-run.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh daily equity dataset'
          git pull --rebase origin main
          git push origin HEAD:main
